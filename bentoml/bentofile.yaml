service: "service:svc"
include:
  - "*.py"
  - "../pyproject.toml"
  - "../car_pricing/**/*.py"
exclude:
  - "tests/"
python:
  packages:
    - pip
    - setuptools
    - wheel
  requirements_txt: "./requirements.txt"
  lock_packages: false
  extra_pip_args:
    - "--no-deps"
docker:
  distro: debian
  python_version: "3.10"
  setup_script: |
    # 安装 car_pricing 核心包本身（依赖已通过 requirements.txt 安装）
    pip install --no-deps -e ../
