[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-pricing"
version = "0.1.0"
description = "Car price prediction machine learning service"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Car Pricing Team"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.7,<2.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "gunicorn>=21.0,<22.0",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.6",
]
streamlit = [
    "streamlit>=1.25,<2.0",
    "requests>=2.31,<3.0",
]
bentoml = [
    "bentoml>=1.2,<2.0",
]
flask = [
    "flask>=2.3,<3.0",
    "gunicorn>=21.0,<22.0",
]
dev = [
    "pytest>=7.4,<8.0",
    "black>=23.0,<24.0",
    "flake8>=6.0,<7.0",
    "mypy>=1.5,<2.0",
]
all = [
    "car-pricing[api,streamlit,bentoml,flask,dev]",
]

[project.scripts]
car-pricing-train = "car_pricing.tools.train:main"

[tool.setuptools.packages.find]
include = ["car_pricing*", "car_pricing_api*"]
exclude = [
    "androidapp*",
    "bentoml*",
    "fastapi*",
    "flaskapp*",
    "mlflow*",
    "notebooks*",
    "streamlitapp*",
    "tests*",
    ".ci*",
    ".github*",
    "Data*",
]

[tool.setuptools.package-data]
car_pricing = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
