[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-pricing"
version = "0.1.0"
description = "Car price prediction model runtime, API client, and shared utilities"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "ML Serving Team" }
]
dependencies = [
    "numpy>=1.19",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "joblib>=1.0",
    "requests>=2.28",
    "pydantic>=1.9",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.80",
    "uvicorn>=0.18",
]
streamlit = [
    "streamlit>=1.20",
    "requests>=2.28",
]
android = [
    "kivy>=2.1",
    "kivymd>=0.104",
    "certifi>=2022.6",
    "requests>=2.28",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.23",
]

[project.scripts]
car-price-predict = "car_pricing.cli:main"

[tool.setuptools.packages.find]
include = ["car_pricing*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
car_pricing = ["*.json"]
