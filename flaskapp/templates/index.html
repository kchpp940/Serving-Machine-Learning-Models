<!DOCTYPE html>
<html>
<!-- Auto-generated from FeatureSchema.form_fields_metadata() -->

<head>
  <meta charset="UTF-8">
  <title>Car Price Prediction ML App</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='w3.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}">
  <style type="text/css">
    .mySlides {
      display: none;
    }
    .field-error {
      color: #c0392b;
      font-size: 0.9em;
      margin-top: 4px;
      display: block;
    }
    .general-error {
      background: #fdecea;
      border: 1px solid #c0392b;
      color: #c0392b;
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

  <div class='w3-padding w3-black w3-center'>
    <h1>Car Price Prediction ML App</h1>
  </div>

  <div class="w3-container">
    <form class="w3-container w3-card-2" action="{{ url_for('predict') }}" method="POST" style="width: 100%">
      <h2 class="w3-text-blue w3-center w3-text-black">Enter Car Details</h2>

      {% if errors._general %}
      <div class="general-error">{{ errors._general }}</div>
      {% endif %}

      {% for f in fields %}
      <p>
        <label class="w3-text-black"><b>{{ f.label }}</b></label>

        {% if f.kind == 'select' %}
          <select id="field_{{ f.name }}"
                  class="w3-input w3-border"
                  name="{{ f.name }}"
                  required="required">
            <option value="">-- Select {{ f.label }} --</option>
            {% for opt in f.options %}
              <option value="{{ opt.form_value }}"
                {% if form_data.get(f.name) == opt.form_value %}selected{% endif %}>
                {{ opt.display }}
              </option>
            {% endfor %}
          </select>

        {% else %}
          <input id="field_{{ f.name }}"
                 class="w3-input w3-border"
                 name="{{ f.name }}"
                 placeholder="{{ f.placeholder or ('Enter ' ~ f.label) }}"
                 required="required"
                 type="{{ f.kind }}"
                 step="any"
                 value="{{ form_data.get(f.name, '') }}">
        {% endif %}

        {% if errors.get(f.name) %}
          <span class="field-error">{{ errors[f.name] }}</span>
        {% endif %}
      </p>
      {% endfor %}

      <p>
        <button onclick="myFunction()" type="submit"
          class="btn btn-primary btn-block btn-large w3-text-black w3-border-black" style="width:100%;">Predict</button>
      </p>
    </form>
  </div>

  <br>

  <div class="footer-dark">
    <footer>
      <div class="container">
        <p class='w3-padding w3-black w3-center'>Made by Ifeanyi Nneji © 2022</p>
      </div>
    </footer>
  </div>

</body>
</html>
